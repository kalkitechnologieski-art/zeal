name: CI\non: [push, pull_request]\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: pnpm/action-setup@v3\n      - uses: actions/setup-node@v4\n        with: { node-version: 20, cache: pnpm }\n      - run: pnpm install --frozen-lockfile\n      - run: pnpm lint\n      - run: pnpm type-check\n      - run: pnpm build\n      - run: pnpm test
